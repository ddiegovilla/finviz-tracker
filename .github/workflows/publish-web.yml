name: Scan and publish website

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 1-5"
      timezone: "America/Monterrey"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: finviz-pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scan with bounded retries
        shell: bash
        run: |
          mkdir -p web-data
          complete=0
          for attempt in 1 2 3; do
            if python -m src.main scan --db web-data/finviz_history.db --timezone America/Monterrey --format json --output web-data/latest-scan.json; then
              complete=1
              break
            fi
            echo "Scan attempt ${attempt} was incomplete."
          done
          if [ "${complete}" -ne 1 ]; then
            echo "::warning::All scan attempts were incomplete; the site will label unavailable filters."
          fi

      - name: Build static website
        run: python -m src.static_site --db web-data/finviz_history.db --output site

      - name: Save scan history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-data/finviz_history.db
          if ! git diff --cached --quiet; then
            git commit -m "Update Finviz scan history"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
